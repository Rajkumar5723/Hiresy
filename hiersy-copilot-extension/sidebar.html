<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Hiersy Copilot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body style="margin:0; padding:0; background:transparent; color:#ccc; font-family:'Inter',sans-serif; overflow:hidden;">
    <div id="copilot-root" style="display:flex; flex-direction:column; height:100vh; overflow:hidden;">
        <div
            style="padding:12px 16px; border-bottom:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:12px; font-weight:500; color:#ff4400;">Hiersy Copilot</span>
            <button id="close-btn" style="background:none; border:none; color:#888; cursor:pointer;">✕</button>
        </div>
        <div style="flex:1; overflow-y:auto; padding:12px;">
            <div id="suggestions"></div>
            <div id="insight" style="margin:12px 0;"></div>
            <div id="flag" style="margin:12px 0;"></div>
        </div>
        <div style="padding:12px; border-top:1px solid rgba(255,255,255,0.1);">
            <input type="text" id="custom-question" placeholder="Type a question..."
                style="width:100%; background:#0d0d0d; border:1px solid #2a2a2a; padding:8px; border-radius:6px; color:#ccc; margin-bottom:8px;" />
            <button id="ask-btn"
                style="width:100%; background:#ff4400; border:none; padding:8px; border-radius:6px; color:#fff; cursor:pointer;">Ask
                AI</button>
        </div>
    </div>
</body>

</html>
